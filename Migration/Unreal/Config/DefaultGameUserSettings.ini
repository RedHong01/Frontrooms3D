[/Script/Engine.GameUserSettings]
; UE applies HDR only when the Windows display/RHI supports it; otherwise the
; engine keeps the SDR swap chain while retaining the project calibration.
bUseHDRDisplayOutput=True
HDRDisplayOutputNits=1000
; UE5.8 reads these native paper-white settings. UE5.6 ignores the
; forward-compatible keys and uses the project calibration section above.
HDRPaperWhiteNits=300.0
HDRUILuminanceNits=300.0
bIsHDRUILuminanceSeparate=False
