[/Script/Engine.RendererSettings]
# Windows HDR is allowed when the display and RHI support it. Unreal falls
# back to SDR automatically when the monitor or driver cannot expose HDR.
r.AllowHDR=1
# The imported static meshes use Nanite. Keep the project-side switch enabled
# so the editor and Win64 package do not fall back to the unsupported SM5 path.
r.Nanite.ProjectEnabled=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=0.0
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
# Hardware ray tracing is available on the Windows DX12 target.  Lumen uses
# it for the GI/reflection scene while direct-light shadows stay on VSM so the
# generated room's many movable point lights do not trigger a ray dispatch per
# light.  The project still falls back to Lumen software tracing if a driver
# does not expose DXR at runtime.
bEnableRayTracing=True
bUseHardwareRayTracingForLumen=True
bGenerateRayTracingProxies=True
bEnableRayTracingShadows=False
ShadowMapMethod=1
r.RayTracing=1
r.Lumen.HardwareRayTracing=1
r.RayTracing.RayTracingProxies.ProjectEnabled=1
r.RayTracing.Shadows=0
r.Shadow.Virtual.Enable=1
r.HDR.Aces.Version=1
r.HDR.Aces.SceneColorMultiplier=1.0
r.HDR.Aces.GamutCompression=0.0
# Match the Unity volume's 300 nit paper-white target; this is multiplied by
# r.HDR.UI.Level when the HDR UI compositor is active.
r.HDR.UI.Luminance=300.0
r.HDR.UI.Level=1.0
r.HDR.UI.CompositeMode=1
r.GenerateMeshDistanceFields=True

