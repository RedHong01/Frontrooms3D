<svg xmlns="http://www.w3.org/2000/svg" width="80" height="48" viewBox="0 0 80 48">
  <title>FrontRooms HUD lock · B padlock · long blue 08 · open</title>
  <desc>Body = B_long_blue_held.svg tag rim, tag body, insert and number, moved by (12.78, 3.262) so the insert centre is at (40, 32): the pivot, on the crosshair point. Shackle: paper stroke 2.6, centreline half-width 10.5, 4 px of leg above the rim, long leg (left) 6 px and short leg 3 px into the rim; open = lifted 5 px and swung 180 degrees round the long leg. Keyline (Red 10-14, no dark card): 1 px #141414 at 85 % outside the rim and the shackle. Same geometry as Figma 3113:6999.</desc>
